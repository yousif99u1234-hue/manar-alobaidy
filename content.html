<!doctype html>

<head>

<meta property="og:description" content="سلسلة محتوى عين المستثمر.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAFA}
a{color:#0A0A0A}a:hover{color:#444}

button{font-family:inherit;cursor:pointer}
</style>

</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0A0A0A; background: #FAFAFA; line-height: 1.7">

<header style="border-bottom: 1px solid #E5E5E5">
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-weight: 700; font-size: 18px">يوسف أحمد</span>
<span style="font-size: 13px; color: #555; font-family: 'Space Grotesk', sans-serif" dir="ltr">Creative Strategist &amp; AI Advisor</span>
</div>
<a href="index.html" style="font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid #BDBDBD; border-radius: 999px; padding: 10px 20px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">→ رجوع للعرض</a>
</div>
</header>

<section style="background: #0A0A0A; color: #FAFAFA">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 32px 64px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 14px; color: #BDBDBD; font-weight: 500">منار المستثمر · ديمو 4 من 4</span>
<h1 style="font-size: clamp(34px, 4.6vw, 56px); line-height: 1.25; font-weight: 700; max-width: 920px">«عين المستثمر»: سلسلة محتوى ما يقدر يكتبها غيرك</h1>
<p style="font-size: 18px; color: #D4D4D4; max-width: 760px; font-weight: 300">الناس تعرفك من Shark Tank، ومتابعينك يعرفونك من الأرقام. السلسلة تجمع الاثنين: شلون يفكر المستثمر لما يسمع عرض مشروع. نفس الفكرة تنزل بـ 3 أشكال.</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
</div>
</section>

<section>
<div style="max-width: 1200px; margin: 0 auto; padding: 48px 32px 96px; display: flex; flex-direction: column; gap: 28px">

<sc-if value="{{ isPost }}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; max-width: 720px; width: 100%; margin: 0 auto; box-sizing: border-box; overflow: hidden">
<div style="display: flex; gap: 12px; align-items: center; padding: 20px 24px 12px">
<div style="width: 48px; height: 48px; border-radius: 999px; background: #0A0A0A; color: #FAFAFA; display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0">م ع</div>
<div style="display: flex; flex-direction: column; line-height: 1.4">
<span style="font-weight: 700; font-size: 15px">منار العبيدي</span>
<span style="font-size: 12px; color: #555">Chairman @ First Finance (FFC) · منشور LinkedIn</span>
</div>
</div>
<div style="padding: 8px 24px 24px; font-size: 16px; line-height: 1.9; white-space: pre-line">عرض يطلب 300 ألف دولار مقابل 5%.
يعني تقييم 6 ملايين دولار.
والإيراد الشهري: صفر.

هذا النوع من العروض يتكرر كثيراً، والمشكلة ليست في الفكرة. الفكرة غالباً جيدة.
المشكلة أن التقييم مبني على حجم السوق، لا على ما تحقق فعلاً.

قبل أن أنظر إلى التقييم، أسأل ثلاثة أسئلة:
1. هل يوجد شخص واحد دفع مقابل المنتج؟
2. كم نسبة من يعود لاستخدامه بعد شهر؟
3. ماذا ستحقق بالمبلغ خلال 6 أشهر، بالأرقام؟

إذا كانت الإجابة على الأول «لا»، فالمشروع يحتاج تجربة قبل أن يحتاج مستثمراً.

ما أول سؤال تسأله أنت قبل أن تضع أموالك في مشروع؟ 👇

#عين_المستثمر #ريادة_الأعمال #العراق</div>
<div style="border-top: 1px solid #E5E5E5; padding: 14px 24px; font-size: 13px; color: #555; background: #FAFAFA">مسودة مثال بأسلوب كتابتك. القصص والأرقام الحقيقية نطلعها من تجاربك أنت.</div>
</div>
</sc-if>

<sc-if value="{{ isCarousel }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 16px">
<span style="font-size: 16px; color: #444">«شنو أشوف بأول 30 ثانية من العرض» · 3 سلايدات من أصل 6</span>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px">
<div style="background: #0A0A0A; color: #FAFAFA; border-radius: 16px; aspect-ratio: 4 / 5; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: #BDBDBD">عين المستثمر · 1/6</span>
<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 700; line-height: 1">30</span>
<p style="font-size: 26px; font-weight: 700; line-height: 1.4">ثانية. هذا كل اللي يحتاجه المستثمر حتى يقرر يكمل يسمع لو لا</p>
</div>
<span style="font-size: 13px; color: #BDBDBD">منار العبيدي</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; aspect-ratio: 4 / 5; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: #555">عين المستثمر · 2/6</span>
<div style="display: flex; flex-direction: column; gap: 16px">
<p style="font-size: 22px; font-weight: 700">أول 3 أشياء أسمعها</p>
<div style="display: flex; gap: 14px; align-items: baseline; border-top: 1px solid #E5E5E5; padding-top: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">01</span><span style="font-size: 17px">منو الزبون، بجملة وحدة</span></div>
<div style="display: flex; gap: 14px; align-items: baseline; border-top: 1px solid #E5E5E5; padding-top: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">02</span><span style="font-size: 17px">شكد بعت لحد هسه</span></div>
<div style="display: flex; gap: 14px; align-items: baseline; border-top: 1px solid #E5E5E5; padding-top: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px">03</span><span style="font-size: 17px">ليش أنت بالذات تنجح بيها</span></div>
</div>
<span style="font-size: 13px; color: #555">منار العبيدي</span>
</div>
<div style="background: #F0F0F0; border-radius: 16px; aspect-ratio: 4 / 5; padding: 32px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between">
<span style="font-size: 13px; color: #555">عين المستثمر · 3/6</span>
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="font-size: 16px; color: #444; font-weight: 500">أكبر خطأ</p>
<p style="font-size: 30px; font-weight: 700; line-height: 1.35">تبدي بحجم السوق</p>
<p style="font-size: 17px">«السوق العراقي 46 مليون نسمة» ما يكول شي عن مشروعك. كلّي شكد زبون دفعلك.</p>
</div>
<span style="font-size: 13px; color: #555">منار العبيدي</span>
</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isReel }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 0 0 280px; background: #0A0A0A; color: #FAFAFA; border-radius: 28px; aspect-ratio: 9 / 16; padding: 28px 22px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; margin-inline: auto">
<span style="font-size: 12px; color: #BDBDBD">ريل 9:16 · 60 ثانية</span>
<p style="font-size: 24px; font-weight: 700; line-height: 1.4; text-align: center">ليش رفضت مشروع بـ 6 مليون دولار؟</p>
<span style="font-size: 12px; color: #BDBDBD; text-align: center">لقطة من الجلسة + كابشن عربي</span>
</div>
<div style="flex: 1 1 420px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<span style="font-size: 14px; color: #555; font-weight: 500">سكربت الريل</span>
<sc-for list="{{ beats }}" as="b" hint-placeholder-count="5">
<div style="display: flex; gap: 16px; border-top: 1px solid #F0F0F0; padding-top: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; color: #555; flex-shrink: 0; width: 64px" dir="ltr">{{ b.t }}</span>
<div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #555">{{ b.k }}</span><span style="font-size: 16px">{{ b.s }}</span></div>
</div>
</sc-for>
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 style="font-size: 22px; font-weight: 700">أول شهر من السلسلة</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1px; background: #E5E5E5; border: 1px solid #E5E5E5">
<sc-for list="{{ plan }}" as="w" hint-placeholder-count="4">
<div style="background: #FFFFFF; padding: 22px; display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: #555">{{ w.n }}</span>
<span style="font-size: 16px; font-weight: 700">{{ w.t }}</span>
<span style="font-size: 13px; color: #444">{{ w.f }}</span>
</div>
</sc-for>
</div>
</div>

</div>
</section>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'post' }; }
renderVals() {
const st = this.state;
const T = [['post', 'منشور LinkedIn'], ['carousel', 'كاروسيل'], ['reel', 'سكربت ريل']];
return {
tabs: T.map((t) => ({ label: t[1], pick: () => this.setState({ tab: t[0] }), style: 'border-radius: 999px; padding: 12px 22px; font-size: 15px; min-height: 44px; ' + (st.tab === t[0] ? 'background: #FAFAFA; color: #0A0A0A; border: 1px solid #FAFAFA; font-weight: 700' : 'background: transparent; color: #FAFAFA; border: 1px solid #555; font-weight: 500') })),
isPost: st.tab === 'post', isCarousel: st.tab === 'carousel', isReel: st.tab === 'reel',
beats: [
{ t: '0–3s', k: 'الهوك', s: 'عرض يطلب 300 ألف دولار، وإيراده صفر.' },
{ t: '3–15s', k: 'الحسبة', s: '300 ألف مقابل 5% يعني تقييم 6 ملايين دولار. على شنو؟' },
{ t: '15–40s', k: 'الدرس', s: 'التقييم ينبني على اللي صار فعلاً، مو على حجم السوق. أول سؤال أسأله: منو دفعلك؟' },
{ t: '40–55s', k: 'النصيحة', s: 'جرّب ويه 50 زبون، وارجع بعد 6 أشهر ويه أرقام.' },
{ t: '55–60s', k: 'الدعوة', s: 'شنو أول سؤال تسأله قبل لا تستثمر؟ اكتبه بالتعليقات.' }
],
plan: [
{ n: 'الأسبوع 1', t: 'ليش رفضت تقييم 6 مليون', f: 'منشور + ريل' },
{ n: 'الأسبوع 2', t: 'شنو أشوف بأول 30 ثانية', f: 'كاروسيل 6 سلايدات' },
{ n: 'الأسبوع 3', t: 'متى القرض أحسن من المستثمر', f: 'منشور + كاروسيل (يربط بـ FFC)' },
{ n: 'الأسبوع 4', t: 'قطاعات أستثمر بيها في 2027 وليش', f: 'منشور بأرقامك الاقتصادية' }
]
};
}
}
mountDC(Component);
</script>
</body>
</html>
