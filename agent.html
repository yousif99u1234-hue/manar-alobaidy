<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ديمو: وكيل اللوحات الاقتصادية | يوسف أحمد</title>
<meta name="description" content="وكيل AI يحدّث اللوحات ويكتب مسودة التحليل.">
<meta property="og:title" content="ديمو: وكيل اللوحات الاقتصادية | يوسف أحمد">
<meta property="og:description" content="وكيل AI يحدّث اللوحات ويكتب مسودة التحليل.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAFA}
a{color:#0A0A0A}a:hover{color:#444}
p{margin:0}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0A0A0A; background: #FAFAFA; line-height: 1.7">

<header style="border-bottom: 1px solid #E5E5E5">
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-weight: 700; font-size: 18px">يوسف أحمد</span>
<span style="font-size: 13px; color: #555; font-family: 'Space Grotesk', sans-serif" dir="ltr">Creative Strategist &amp; AI Advisor</span>
</div>
<a href="index.html" style="font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid #BDBDBD; border-radius: 999px; padding: 10px 20px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">→ رجوع للعرض</a>
</div>
</header>

<section style="background: #0A0A0A; color: #FAFAFA">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 32px 64px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 14px; color: #BDBDBD; font-weight: 500">ديمو 1 من 3</span>
<h1 style="font-size: clamp(34px, 4.6vw, 56px); line-height: 1.25; font-weight: 700; max-width: 900px">وكيل AI يحدّث لوحاتك ويكتب مسودة التحليل</h1>
<p style="font-size: 18px; color: #D4D4D4; max-width: 760px; font-weight: 300">اختار مجموعة بيانات واضغط تشغيل. الوكيل يسحب البيانات، يطابقها، يحدّث اللوحة، ويطلعلك مسودة بالعربي والإنكليزي. أنت تراجع، تضيف رأيك، وتنشر.</p>
</div>
</section>

<section>
<div style="max-width: 1200px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: #555; font-weight: 500">1 · اختار البيانات</span>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
</sc-for>
</div>
</div>

<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center">
<span style="font-size: 14px; color: #555; font-weight: 500">2 · الوكيل يشتغل</span>
<button type="button" onClick="{{ rerun }}" style="background: #0A0A0A; color: #FAFAFA; border: none; border-radius: 999px; padding: 12px 24px; font-size: 15px; font-weight: 700; min-height: 44px">شغّل الوكيل من جديد</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
<div style="{{ s.box }}">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">{{ s.n }}</span>
<span style="{{ s.badge }}">{{ s.status }}</span>
</div>
<span style="font-size: 15px; font-weight: 700">{{ s.title }}</span>
<span style="font-size: 13px; color: #555">{{ s.detail }}</span>
</div>
</sc-for>
</div>
</div>

<sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px">

<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; color: #555; font-weight: 500">3 · اللوحة المحدّثة</span>
<h2 style="font-size: 22px; font-weight: 700; line-height: 1.4">{{ ds.title }}</h2>
<span style="font-size: 13px; color: #555">{{ ds.period }}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 12px; font-size: 14px">
<span>{{ r.label }}</span>
<span style="display: flex; gap: 10px; align-items: baseline"><span style="color: #555; font-size: 13px">{{ r.note }}</span><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700" dir="ltr">{{ r.pct }}</span></span>
</div>
<div style="height: 10px; background: #F0F0F0; border-radius: 5px; overflow: hidden"><div style="{{ r.bar }}"></div></div>
</div>
</sc-for>
</div>
<div style="display: flex; gap: 20px; font-size: 13px; color: #555; flex-wrap: wrap">
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: #0A0A0A; border-radius: 3px"></span>انخفاض</span>
<span style="display: inline-flex; gap: 6px; align-items: center"><span style="width: 12px; height: 12px; background: #8A8A8A; border-radius: 3px"></span>ارتفاع</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
<span style="font-size: 14px; color: #555; font-weight: 500">4 · مسودة التحليل</span>
<div style="display: flex; gap: 8px">
<button type="button" onClick="{{ setAr }}" style="{{ arStyle }}">عربي</button>
<button type="button" onClick="{{ setEn }}" style="{{ enStyle }}">English</button>
</div>
</div>
<p dir="{{ dir }}" style="font-size: 17px; line-height: 1.9">{{ draft }}</p>
<span style="font-size: 12px; border: 1px solid #BDBDBD; padding: 4px 12px; border-radius: 999px; color: #444; align-self: flex-start">مسودة · بانتظار مراجعتك ورأيك</span>
</div>
<div style="background: #0A0A0A; color: #FAFAFA; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: #BDBDBD; font-weight: 500">تنبيهات الوكيل: تستاهل منشور</span>
<sc-for list="{{ alerts }}" as="a" hint-placeholder-count="3">
<div dir="{{ dir }}" style="display: flex; gap: 12px; align-items: baseline; border-top: 1px solid #262626; padding-top: 12px">
<span style="font-family: 'Space Grotesk', sans-serif; color: #BDBDBD; font-size: 13px">{{ a.n }}</span>
<span style="font-size: 16px">{{ a.text }}</span>
</div>
</sc-for>
</div>
</div>

</div>
</sc-if>

<div style="background: #F0F0F0; padding: 20px 24px; border-radius: 12px; font-size: 15px; color: #333">
<strong style="color: #0A0A0A">الأرقام بهالديمو مأخوذة من منشوراتك.</strong> بالنسخة الحقيقية، الوكيل يسحبها مباشرة من المصادر حسب جدول نشر كل جهة، ويوصلك التقرير على الإيميل أو الواتساب.
</div>

</div>
</section>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { ds: 'partners', lang: 'ar', stage: 5 };
}
componentWillUnmount() { if (this.timer) clearInterval(this.timer); }
run(ds) {
if (this.timer) clearInterval(this.timer);
this.setState({ ds: ds, stage: 1 });
this.timer = setInterval(() => {
const next = (this.state.stage || 0) + 1;
if (next >= 5 && this.timer) { clearInterval(this.timer); this.timer = null; }
this.setState({ stage: Math.min(next, 5) });
}, 700);
}
data() {
return {
partners: {
tab: 'صادرات الشركاء للعراق',
title: 'صادرات أكبر 6 شركاء تجاريين إلى العراق',
period: 'النصف الأول 2026 مقابل النصف الأول 2025 · مليار دولار',
sources: 'جمارك الصين، الإحصاء الإماراتي، تركيا، الهند، EU، الولايات المتحدة',
rows: [
{ label: 'الهند', note: '1.8 ← 0.9', p: -51 },
{ label: 'الصين', note: '8.9 ← 5.2', p: -42 },
{ label: 'الولايات المتحدة', note: '0.76 ← 0.48', p: -37 },
{ label: 'الإمارات', note: '14.1 ← 10.6', p: -25 },
{ label: 'تركيا', note: '4.9 ← 4.1', p: -17 },
{ label: 'الاتحاد الأوروبي', note: '2.9 ← 2.5', p: -15 }
],
ar: 'تراجعت صادرات أكبر ستة شركاء تجاريين للعراق إلى 23.7 مليار دولار في النصف الأول من 2026، مقابل 33.4 مليار في الفترة نفسها من 2025، بانخفاض 29%. التراجع شمل الجميع، وكان الأشد في الهند (−51%) والصين (−42%). الإمارات بقيت المورد الأول رغم انخفاضها 25%. تركز الانخفاض في السلع الرأسمالية، ما يشير إلى تباطؤ المشاريع لا الاستهلاك.',
en: 'Exports from Iraq’s six largest trading partners fell to $23.7B in H1 2026, down 29% from $33.4B a year earlier. Every partner declined, led by India (−51%) and China (−42%). The UAE remains the top supplier despite a 25% drop. The decline is concentrated in capital goods, pointing to stalled projects rather than weaker consumption.',
alertsAr: ['أكبر انخفاض: الهند −51%', 'الإمارات ما زالت المورد الأول بـ 10.6 مليار دولار', 'السلع الرأسمالية الأكثر تراجعاً: الوقود −59%، الحديد والصلب −48%، الآلات −42%'],
alertsEn: ['Largest drop: India −51%', 'UAE is still the top supplier at $10.6B', 'Capital goods fell hardest: fuels −59%, iron & steel −48%, machinery −42%']
},
china: {
tab: 'صادرات الصين (9 أشهر)',
title: 'صادرات الصين إلى العراق حسب البند',
period: 'الأشهر التسعة الأولى 2026 مقابل 2025 · الإجمالي 13.0 ← 8.9 مليار دولار',
sources: 'الجمارك الصينية · بيانات البنود التفصيلية',
rows: [
{ label: 'الرافعات', note: '', p: -97 },
{ label: 'معدات الحفر والتسوية', note: '', p: -86 },
{ label: 'المولدات', note: '', p: -64 },
{ label: 'الحديد والصلب', note: '', p: -56 },
{ label: 'الآلات والمعدات', note: '', p: -49 },
{ label: 'المعدات الكهربائية', note: '', p: -35 },
{ label: 'السيارات', note: '635 مليون $', p: 84 }
],
ar: 'تراجعت صادرات الصين إلى العراق 31.7% في الأشهر التسعة الأولى من 2026، من 13.0 إلى 8.9 مليار دولار. الضربة الأكبر في معدات المشاريع: الرافعات −97%، ومعدات الحفر −86%، والمولدات −64%. في المقابل قفزت السيارات 84% لتصبح البند الأول. المستهلك ما زال يشتري، لكن المشاريع تباطأت.',
en: 'China’s exports to Iraq fell 31.7% in the first nine months of 2026, from $13.0B to $8.9B. Project equipment took the hardest hit: cranes −97%, drilling equipment −86%, generators −64%. Cars went the other way, up 84% to become the top import line. Consumers are still buying; projects have slowed.',
alertsAr: ['5 بنود معدات مشاريع تراجعت أكثر من 45%', 'السيارات صارت البند الأول من الصين لأول مرة', 'المكيفات وحدها تفسر حوالي 14% من الفجوة'],
alertsEn: ['5 project-equipment lines fell by more than 45%', 'Cars are China’s top export line to Iraq for the first time', 'Air conditioners alone explain about 14% of the gap']
},
food: {
tab: 'أسعار الغذاء بعد سعر الصرف',
title: 'أبرز ارتفاعات أسعار الغذاء بعد تعديل سعر الصرف',
period: 'تشرين الثاني 2026 · السعر الرسمي 1,520 ديناراً · 25 سلعة أساسية',
sources: 'برنامج الأغذية العالمي · أسواق بغداد والبصرة وأربيل',
rows: [
{ label: 'البصل · البصرة', note: '', p: 100 },
{ label: 'البطاطا · البصرة', note: '', p: 68 },
{ label: 'البصل · بغداد', note: '', p: 45 },
{ label: 'السكر · أربيل', note: '1,050 ← 1,500', p: 43 },
{ label: 'الأرز · أربيل', note: '', p: 31 },
{ label: 'الحليب المجفف · بغداد', note: '', p: 18 }
],
ar: 'بعد تعديل السعر الرسمي إلى 1,520 ديناراً، ارتفع الدولار في السوق الموازية 7%، وارتفعت أسعار الغذاء 10% في البصرة و6.5% في بغداد وأربيل خلال أسابيع. الزيادة تركزت في السلع المستوردة المسعّرة بالدولار، بينما بقي الخبز والدجاج والبيض مستقراً. قد تظهر زيادات أخرى مع نفاد المخزون الذي اشتُري بالسعر القديم.',
en: 'After the official rate moved to IQD 1,520, the parallel-market dollar rose 7% and food prices climbed 10% in Basra and 6.5% in Baghdad and Erbil within weeks. Increases were concentrated in dollar-priced imports, while bread, chicken and eggs held steady. More increases may follow as stock bought at the old rate runs out.',
alertsAr: ['البصرة الأعلى ارتفاعاً: +10%', 'الخبز والدقيق والدجاج والبيض بقت مستقرة', 'الفجوة بين الرسمي والموازي ثابتة عند حوالي 10%'],
alertsEn: ['Basra saw the steepest rise: +10%', 'Bread, flour, chicken and eggs held steady', 'The official–parallel gap is stable at about 10%']
}
};
}
renderVals() {
const st = this.state;
const all = this.data();
const ds = all[st.ds];
const stage = st.stage;
const keys = ['partners', 'china', 'food'];
const tabs = keys.map((k) => ({
label: all[k].tab,
pick: () => this.run(k),
style: 'border-radius: 999px; padding: 12px 22px; font-size: 15px; font-weight: 500; min-height: 44px; ' + (k === st.ds ? 'background: #0A0A0A; color: #FAFAFA; border: 1px solid #0A0A0A' : 'background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD')
}));
const stepDefs = [
{ t: 'سحب البيانات', d: ds.sources },
{ t: 'مطابقة وتنظيف', d: 'توحيد الوحدات والفترات، ومقارنة المصادر ببعض' },
{ t: 'تحديث اللوحة', d: 'iraqfuture2026.com' },
{ t: 'كتابة المسودة', d: 'عربي وإنكليزي، مع أهم التغيرات' }
];
const steps = stepDefs.map((s, i) => {
const isDone = stage === 5 || i < stage - 1;
const isRun = stage !== 5 && i === stage - 1;
return {
n: '0' + (i + 1), title: s.t, detail: s.d,
status: isDone ? 'تم' : isRun ? 'جارٍ…' : 'بالانتظار',
box: 'border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 6px; ' + (isRun ? 'border: 2px solid #0A0A0A; background: #FFFFFF' : isDone ? 'border: 1px solid #E5E5E5; background: #FAFAFA' : 'border: 1px dashed #BDBDBD; background: #FFFFFF'),
badge: 'font-size: 12px; border-radius: 999px; padding: 2px 10px; ' + (isDone ? 'background: #0A0A0A; color: #FAFAFA' : 'border: 1px solid #BDBDBD; color: #444')
};
});
const max = Math.max.apply(null, ds.rows.map((r) => Math.abs(r.p)));
const rows = ds.rows.map((r) => ({
label: r.label, note: r.note,
pct: (r.p > 0 ? '+' : '−') + Math.abs(r.p) + '%',
bar: 'height: 100%; border-radius: 5px; width: ' + Math.round(Math.abs(r.p) / max * 100) + '%; background: ' + (r.p < 0 ? '#0A0A0A' : '#8A8A8A')
}));
const en = st.lang === 'en';
const alerts = (en ? ds.alertsEn : ds.alertsAr).map((t, i) => ({ n: '0' + (i + 1), text: t }));
const on = 'border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; background: #0A0A0A; color: #FAFAFA; border: 1px solid #0A0A0A';
const off = 'border-radius: 999px; padding: 8px 16px; font-size: 14px; min-height: 44px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD';
return {
tabs: tabs, steps: steps, rows: rows, alerts: alerts,
ds: { title: ds.title, period: ds.period },
done: stage === 5,
rerun: () => this.run(st.ds),
draft: en ? ds.en : ds.ar,
dir: en ? 'ltr' : 'rtl',
setAr: () => this.setState({ lang: 'ar' }),
setEn: () => this.setState({ lang: 'en' }),
arStyle: en ? off : on,
enStyle: en ? on : off
};
}
}
mountDC(Component);
</script>
</body>
</html>
