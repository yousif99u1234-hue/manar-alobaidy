<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ديمو: متابعة المحفظة | يوسف أحمد</title>
<meta name="description" content="كل شركات المحفظة بلوحة وحدة.">
<meta property="og:title" content="ديمو: متابعة المحفظة | يوسف أحمد">
<meta property="og:description" content="كل شركات المحفظة بلوحة وحدة.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAFA}
a{color:#0A0A0A}a:hover{color:#444}
p{margin:0}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer;text-align:inherit}
</style>
<style>html{scroll-behavior:smooth}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">

<div dir="rtl" style="font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #0A0A0A; background: #FAFAFA; line-height: 1.7">

<header style="border-bottom: 1px solid #E5E5E5">
<div style="max-width: 1200px; margin: 0 auto; padding: 20px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-weight: 700; font-size: 18px">يوسف أحمد</span>
<span style="font-size: 13px; color: #555; font-family: 'Space Grotesk', sans-serif" dir="ltr">Creative Strategist &amp; AI Advisor</span>
</div>
<a href="index.html" style="font-size: 14px; font-weight: 500; text-decoration: none; border: 1px solid #BDBDBD; border-radius: 999px; padding: 10px 20px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center">→ رجوع للعرض</a>
</div>
</header>

<section style="background: #0A0A0A; color: #FAFAFA">
<div style="max-width: 1200px; margin: 0 auto; padding: 72px 32px 64px; display: flex; flex-direction: column; gap: 20px">
<span style="font-size: 14px; color: #BDBDBD; font-weight: 500">منار المستثمر · ديمو 3 من 4</span>
<h1 style="font-size: clamp(34px, 4.6vw, 56px); line-height: 1.25; font-weight: 700; max-width: 920px">كل شركاتك بلوحة وحدة، والتنبيه يوصلك قبل المشكلة</h1>
<p style="font-size: 18px; color: #D4D4D4; max-width: 760px; font-weight: 300">كل شهر صاحب المشروع يبعث 3 أرقام برسالة واتساب: المبيعات، والمصاريف، والرصيد. الوكيل يقراها، يحدّث اللوحة، ويحسب شكد شهر يكفي الكاش.</p>
<span style="font-size: 13px; border: 1px solid #555; color: #D4D4D4; padding: 6px 14px; border-radius: 999px; align-self: flex-start">الشركات والأرقام بهالديمو تجريبية لأغراض العرض</span>
</div>
</section>

<section>
<div style="max-width: 1200px; margin: 0 auto; padding: 48px 32px 96px; display: flex; flex-direction: column; gap: 24px">

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1px; background: #E5E5E5; border: 1px solid #E5E5E5">
<sc-for list="{{ stats }}" as="k" hint-placeholder-count="4">
<div style="background: #FFFFFF; padding: 20px 24px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; line-height: 1.1" dir="ltr">{{ k.v }}</span>
<span style="font-size: 14px; color: #444">{{ k.l }}</span>
</div>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px">
<sc-for list="{{ cos }}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{ c.pick }}" style="{{ c.style }}">
<span style="display: flex; justify-content: space-between; gap: 8px; align-items: center"><span style="font-size: 16px; font-weight: 700">{{ c.name }}</span><span style="{{ c.badge }}">{{ c.status }}</span></span>
<span style="font-size: 13px">{{ c.line }}</span>
</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">
<div style="flex: 1.5 1 460px; min-width: 0; background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 13px; color: #555">{{ s.sector }} · استثمرت {{ s.stake }}</span>
<h2 style="font-size: 24px; font-weight: 700">{{ s.name }}</h2>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; color: #555; font-weight: 500">المبيعات الشهرية · ألف دولار</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; align-items: end; height: 190px" dir="rtl">
<sc-for list="{{ s.bars }}" as="b" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; height: 100%">
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700">{{ b.v }}</span>
<div style="{{ b.bar }}"></div>
<span style="font-size: 12px; color: #555">{{ b.m }}</span>
</div>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: #E5E5E5; border: 1px solid #E5E5E5">
<sc-for list="{{ s.kpis }}" as="k" hint-placeholder-count="3">
<div style="background: #FFFFFF; padding: 14px 16px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #555">{{ k.l }}</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700" dir="ltr">{{ k.v }}</span></div>
</sc-for>
</div>
</div>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="background: #FFFFFF; border: 1px solid #E5E5E5; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 14px; color: #555; font-weight: 500">رسالة صاحب المشروع هالشهر</span>
<div style="background: #F0F0F0; border-radius: 14px; padding: 14px 16px; font-size: 15px; white-space: pre-line">{{ s.msg }}</div>
<span style="font-size: 13px; color: #555">الوكيل حوّل المبالغ للدولار بسعر 1,520 وحدّث اللوحة تلقائياً.</span>
</div>
<div style="{{ s.alertBox }}">
<span style="font-size: 13px; font-weight: 500; color: {{ s.alertMuted }}">تنبيه الوكيل</span>
<p style="font-size: 16px; font-weight: 700">{{ s.alert }}</p>
<p style="font-size: 14px; color: {{ s.alertMuted }}">{{ s.next }}</p>
</div>
</div>
</div>

</div>
</section>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { i: 2 }; }
renderVals() {
const months = ['حزيران', 'تموز', 'آب', 'أيلول', 'ت1', 'ت2'];
const C = [
{ name: 'سلّتي', sector: 'توصيل بقالة', stake: '10%', rev: [18, 20, 22, 25, 27, 29.6], cash: 210, burn: 14,
msg: 'مبيعات تشرين الثاني: 45 مليون\nالمصاريف: 66 مليون\nالرصيد: 319 مليون',
alert: 'على المسار: المبيعات صاعدة 6 أشهر متتالية.', next: 'لا يحتاج تدخل. ممكن تطلب منه خطة التوسع للبصرة.' },
{ name: 'حجز العيادات', sector: 'تقنيات صحية', stake: '12%', rev: [9, 9.5, 10, 10.4, 10.8, 11.2], cash: 95, burn: 6,
msg: 'المبيعات: 17 مليون\nالمصاريف: 26.1 مليون\nالرصيد: 144 مليون',
alert: 'نمو هادئ وثابت حوالي 4% شهرياً.', next: 'الكاش يكفي أكثر من سنة. راقب نسبة العيادات اللي تلغي الاشتراك.' },
{ name: 'ألبان الجنوب', sector: 'صناعات غذائية', stake: '15%', rev: [40, 42, 41, 37, 33, 30], cash: 60, burn: 12,
msg: 'مبيعات الشهر: 45.6 مليون\nالمصاريف: 63.8 مليون\nالرصيد: 91.2 مليون',
alert: 'المبيعات نازلة 4 أشهر متتالية، و29% أقل من أعلى شهر.', next: 'الكاش يكفي 5 أشهر بس. اجتماع ويه المؤسس هالأسبوع حتى تفهم السبب قبل لا يصير أزمة.' },
{ name: 'مشوار', sector: 'نقل وتوصيل ركاب', stake: '8%', rev: [15, 16, 15.5, 16, 15.8, 16.2], cash: 40, burn: 9,
msg: 'المبيعات: 24.6 مليون\nالمصاريف: 38.3 مليون\nالرصيد: 60.8 مليون',
alert: 'المبيعات ثابتة 6 أشهر والكاش يكفي حوالي 4 أشهر.', next: 'يحتاج قرار: جولة تمويل جديدة، أو تقليل المصاريف 30% حتى يوصل للتعادل.' }
];
const runway = (c) => c.cash / c.burn;
const statusOf = (c) => runway(c) < 6 ? 'risk' : 'ok';
const st = this.state;
const s = C[st.i];
const max = Math.max.apply(null, s.rev);
const risk = statusOf(s) === 'risk';
const growth = Math.round((s.rev[5] - s.rev[0]) / s.rev[0] * 100);
const totalRev = C.reduce((a, c) => a + c.rev[5], 0);
return {
stats: [
{ v: String(C.length), l: 'شركات بالمحفظة' },
{ v: '$' + totalRev.toFixed(1) + 'K', l: 'مبيعات المحفظة هالشهر' },
{ v: String(C.filter((c) => statusOf(c) === 'ok').length), l: 'على المسار' },
{ v: String(C.filter((c) => statusOf(c) === 'risk').length), l: 'تحتاج انتباهك' }
],
cos: C.map((c, i) => {
const on = i === st.i;
const r = statusOf(c) === 'risk';
return {
name: c.name, status: r ? 'تحتاج انتباه' : 'على المسار',
line: c.sector + ' · الكاش يكفي ' + runway(c).toFixed(1) + ' شهر',
pick: () => this.setState({ i: i }),
style: 'display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 12px; width: 100%; box-sizing: border-box; min-height: 44px; ' + (on ? 'background: #0A0A0A; color: #FAFAFA; border: 1px solid #0A0A0A' : 'background: #FFFFFF; color: #0A0A0A; border: 1px solid #E5E5E5'),
badge: 'font-size: 12px; border-radius: 999px; padding: 2px 10px; white-space: nowrap; ' + (r ? (on ? 'background: #FAFAFA; color: #0A0A0A' : 'background: #0A0A0A; color: #FAFAFA') : 'border: 1px solid ' + (on ? '#BDBDBD; color: #E5E5E5' : '#555; color: #333'))
};
}),
s: {
name: s.name, sector: s.sector, stake: s.stake, msg: s.msg, alert: s.alert, next: s.next,
bars: s.rev.map((v, i) => ({ v: String(v), m: months[i], bar: 'width: 100%; border-radius: 6px 6px 0 0; height: ' + Math.round(v / max * 130) + 'px; background: ' + (i === 5 ? '#0A0A0A' : '#BDBDBD') })),
kpis: [
{ l: 'النمو خلال 6 أشهر', v: (growth > 0 ? '+' : '') + growth + '%' },
{ l: 'الرصيد', v: '$' + s.cash + 'K' },
{ l: 'الحرق الشهري', v: '$' + s.burn + 'K' },
{ l: 'الكاش يكفي', v: runway(s).toFixed(1) + ' شهر' }
],
alertBox: 'border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 8px; flex: 1; ' + (risk ? 'background: #0A0A0A; color: #FAFAFA' : 'background: #FFFFFF; border: 1px solid #E5E5E5'),
alertMuted: risk ? '#BDBDBD' : '#555'
}
};
}
}
mountDC(Component);
</script>
</body>
</html>
